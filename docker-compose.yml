services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: appadmin
      POSTGRES_PASSWORD: adminpw
      POSTGRES_DB: appdb
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appadmin -d appdb"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Connects as the SELECT-only role created in db/init/03_grants.sql.
      DATABASE_URL: postgresql+psycopg://app_readonly:readonly_pw@db:5432/appdb
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Auth: set AUTH_SECRET_KEY for stable tokens across restarts.
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
      AUTH_SEED_DEMO: ${AUTH_SEED_DEMO:-true}
      # Shared rate-limit + token-revocation store across instances.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "8000:8000"

  frontend:
    build: .
    depends_on:
      - api
    environment:
      API_URL: http://api:8000
    command: streamlit run frontend/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
